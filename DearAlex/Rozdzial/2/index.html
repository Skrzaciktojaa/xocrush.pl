<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../../../images/calus.png">
    <title>Pustkaaaaaa... | XOCrush.pl</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Definicja lokalnej czcionki Nunito -->
    <style>
        @font-face {
            font-family: 'Nunito';
            src: url('../../../fonts/Nunito-Variable.woff2') format('woff2');
            font-weight: 200 900;
            font-style: normal;
            font-display: swap;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slateDark: '#0b0f17',       // Głęboka, ciemna szarość tła
                        slateCard: '#151d2a',       // Szara karta
                        slateBorder: '#27354a',     // Szara ramka
                        slateAccent: '#334155',     // Akcentowy szary
                        pureWhite: '#ffffff',       // Czysta biel
                        silverDust: '#e2e8f0',      // Jasny srebrny tekst
                    },
                    fontFamily: {
                        sans: ['"Montserrat"', 'sans-serif'],
                        serif: ['"Nunito"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Tło z pliku poprostu.png z LEKKIM przyciemnieniem (0.4 / 0.5) */
        body {
            background-color: #0b0f17;
            background-image: linear-gradient(rgba(11, 15, 23, 0.4), rgba(11, 15, 23, 0.5)), url('../../../images/poprostu.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Typography Glowing Effect (White Glow) */
        .text-glow {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f17;
        }
        ::-webkit-scrollbar-thumb {
            background: #27354a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="text-gray-200 font-sans min-h-screen flex flex-col selection:bg-white selection:text-black relative">

    <!-- Top Navigation Bar -->
    <header class="w-full py-6 px-4 z-40">
        <div class="max-w-4xl mx-auto flex justify-center items-center">
            <nav class="flex items-center gap-6 bg-black/50 px-6 py-2 rounded-full backdrop-blur-md border border-slateBorder/50">
                <a href="../../../index.html" class="text-sm font-medium text-gray-300 hover:text-white transition-colors duration-200">
                    Strona główna
                </a>
                <span class="text-slateBorder">•</span>
                <a href="../../../stories.html" class="text-sm font-medium text-white hover:text-gray-300 transition-colors duration-200">
                    Historyjki
                </a>
            </nav>
        </div>
    </header>

    <!-- Header Section with Large Centered Logo -->
    <section class="pt-2 pb-6 px-4 text-center">
        <div class="max-w-4xl mx-auto flex flex-col items-center">
            <a href="../../../index.html" class="inline-block transition-transform duration-300 hover:scale-105">
                <img 
                    src="../../../images/logoo.png" 
                    alt="XOCrush.pl Logo" 
                    class="h-28 md:h-36 object-contain drop-shadow-[0_0_25px_rgba(255,255,255,0.25)]"
                    onerror="this.onerror=null; this.src='https://placehold.co/400x120/0b0f17/FFFFFF?text=XOCrush.pl';"
                >
            </a>
        </div>
    </section>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 pb-16 flex items-center justify-center">
        
        <!-- Empty State Card -->
        <article class="w-full p-8 md:p-12 text-center space-y-6 relative overflow-hidden bg-black/40 backdrop-blur-md rounded-2xl border border-slateBorder/40 shadow-2xl">
            <div class="absolute -top-24 -right-24 w-60 h-60 bg-white/5 rounded-full blur-3xl pointer-events-none"></div>

            <div class="w-16 h-16 mx-auto rounded-full bg-slateAccent/40 border border-slateBorder flex items-center justify-center text-white shadow-inner">
                <i data-lucide="moon" class="w-8 h-8 text-white"></i>
            </div>

            <div class="space-y-3">
                <h1 class="text-4xl md:text-6xl font-serif font-bold text-white tracking-tight text-glow">
                    Pustkaaaaaa...
                </h1>
                <p class="text-gray-300 text-base md:text-lg font-light max-w-md mx-auto">
                    Jeszcze nie ma tego rozdziału, lecz ciągle nad nim pracujemy!
                </p>
            </div>

            <div class="pt-4">
                <a href="../../../stories.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-slateDark border border-slateBorder hover:border-white text-xs font-semibold text-gray-200 transition-all shadow-lg">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Wróć do spisu historii
                </a>
            </div>
        </article>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slateBorder py-6 text-center text-xs text-gray-400 bg-black/60">
        <p>© 2026 XOCrush.pl — Wszystkie prawa zastrzeżone. 🖤</p>
    </footer>

    <!-- Interactive Scripts -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
