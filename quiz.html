<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="images/calus.png">

<title>Quiz 💌 | XO Crush</title>

<link rel="icon" type="image/png" href="images/calus.png">
<meta name="description" content="Rozwiąż quiz XO Crush i sprawdź, czy znasz mój sekret!">

<style>
@font-face {
    font-family: "Margarine";
    src: url("images/Margarine-Regular.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: #171017 url("images/poprostu.png") center center / cover fixed no-repeat;
}

.logo {
    position: absolute;
    top: 18px;
    left: 22px;
    width: 135px;
    height: auto;
    z-index: 10;
}

.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 70px 20px 50px;
}

.hero-logo {
    width: 480px;
    max-width: 90%;
    height: auto;
    display: block;
    margin: 0 auto 20px;
}

.subtitle {
    font-family: "Margarine", cursive;
    font-size: 46px;
    font-weight: normal;
    color: white;
    text-shadow: 0 3px 12px #000, 0 0 20px #000;
    margin: 0;
    line-height: 1.4;
    max-width: 950px;
    min-height: 1.4em;
}

/* Migający kursor podczas pisania */
.subtitle.typing::after {
    content: "|";
    display: inline-block;
    margin-left: 3px;
    animation: cursorBlink 0.7s infinite;
}

@keyframes cursorBlink {
    0%, 50% {
        opacity: 1;
    }
    51%, 100% {
        opacity: 0;
    }
}

.quiz {
    width: min(400px, 92%);
    margin-top: 40px;
    padding: 25px;
    background: rgba(25, 12, 25, 0.92);
    border: 1px solid rgba(255, 180, 210, 0.65);
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255, 80, 150, 0.25);
}

.quiz h2 {
    margin: 0 0 20px;
    color: #ffb5d2;
    font-size: 25px;
}

.hint {
    font-size: 14px;
    color: #ffc2dc;
    margin-bottom: 22px;
    line-height: 1.5;
}

.question {
    font-size: 20px;
    font-weight: bold;
    margin: 20px 0;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #ff9dc5;
    background: white;
    color: #222;
    font-size: 16px;
    margin-bottom: 15px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 20px;
    background: #ff8fbd;
    color: #3b1025;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #ffc1da;
}

.gender-buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.gender-button {
    font-size: 35px;
    width: 100px;
    height: 75px;
}

#feedback {
    margin-top: 15px;
    font-size: 16px;
    line-height: 1.5;
}

.score {
    font-size: 34px;
    color: #ffb5d2;
    margin: 20px 0;
}

.back-button {
    display: inline-block;
    margin-top: 25px;
    color: #ffc1da;
    text-decoration: none;
    font-weight: bold;
}

.back-button:hover {
    color: white;
}

@media (max-width: 700px) {
    .logo {
        width: 105px;
        top: 12px;
        left: 12px;
    }

    .hero {
        padding-top: 100px;
    }

    .hero-logo {
        width: 340px;
        max-width: 95%;
    }

    .subtitle {
        font-size: 32px;
    }

    .quiz {
        margin-top: 30px;
        padding: 20px;
    }
}

/* Jeśli ktoś ogranicza animacje w systemie */
@media (prefers-reduced-motion: reduce) {
    .subtitle.typing::after {
        animation: none;
    }

    button {
        transition: none;
    }
}
</style>
</head>

<body>

<img src="images/logoo.png" alt="XO CRUSH.pl" class="logo">

<main class="hero">

    <img src="images/logoo.png" alt="XO CRUSH.pl" class="hero-logo">

    <p class="subtitle" id="subtitle">Tutaj poznasz mój sekret 💌</p>

    <section class="quiz">

        <h2>💌 Mały quiz</h2>

        <p class="hint">
            JAK SIĘ DOWIESZ, TO NIKOMU NIE MÓW 🤫
        </p>

        <div id="quizContent"></div>
        <p id="feedback" aria-live="polite"></p>

    </section>

    <a href="index.html" class="back-button">
        ← Wróć na stronę główną
    </a>

</main>

<script>
/* ANIMACJA PISANIA NAPISU */
const subtitle = document.getElementById("subtitle");

if (subtitle) {
    const text = subtitle.textContent;
    const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;

    if (!prefersReducedMotion) {
        subtitle.textContent = "";
        subtitle.classList.add("typing");

        let index = 0;

        const typing = setInterval(function() {
            subtitle.textContent += text.charAt(index);
            index++;

            if (index >= text.length) {
                clearInterval(typing);
                subtitle.classList.remove("typing");
            }
        }, 65);
    }
}

const questions = [
    {
        question: "Z której jest klasy?",
        type: "text",
        answers: ["7a", "8b"]
    },
    {
        question: "Jaki ma kolor włosów?",
        type: "text",
        answers: ["brązowy", "brąz", "brązowe"]
    },
    {
        question: "Jakiej jest płci?",
        type: "gender",
        answer: "♂️"
    },
    {
        question: "Jak ma na imię?",
        type: "text",
        answers: ["heniek", "henryk"]
    }
];

let currentQuestion = 0;
let score = 0;
let locked = false;

const quizContent = document.getElementById("quizContent");
const feedback = document.getElementById("feedback");

function showQuestion() {
    locked = false;
    feedback.textContent = "";

    if (currentQuestion >= questions.length) {
        showResult();
        return;
    }

    const q = questions[currentQuestion];

    quizContent.innerHTML = "";

    const questionText = document.createElement("p");
    questionText.className = "question";
    questionText.textContent = q.question;
    quizContent.appendChild(questionText);

    if (q.type === "text") {
        const input = document.createElement("input");
        input.type = "text";
        input.id = "answerInput";
        input.placeholder = "Wpisz odpowiedź...";
        input.autocomplete = "off";

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Sprawdź 💗";
        button.addEventListener("click", checkAnswer);

        input.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });

        quizContent.appendChild(input);
        quizContent.appendChild(button);
        input.focus();
    }

    if (q.type === "gender") {
        const buttons = document.createElement("div");
        buttons.className = "gender-buttons";

        ["♂️", "♀️"].forEach(function(symbol) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "gender-button";
            button.textContent = symbol;

            button.addEventListener("click", function() {
                checkGender(symbol);
            });

            buttons.appendChild(button);
        });

        quizContent.appendChild(buttons);
    }
}

function checkAnswer() {
    if (locked) return;

    const input = document.getElementById("answerInput");
    if (!input) return;

    const answer = input.value
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

    if (answer === "") {
        feedback.textContent = "Wpisz odpowiedź najpierw 🥺";
        return;
    }

    const correctAnswers = questions[currentQuestion].answers;

    if (correctAnswers.includes(answer)) {
        nextQuestion();
    } else {
        feedback.textContent = "Hmm, spróbuj jeszcze raz 👀";
    }
}

function checkGender(answer) {
    if (locked) return;

    if (answer === questions[currentQuestion].answer) {
        nextQuestion();
    } else {
        feedback.textContent = "Hmm, spróbuj jeszcze raz 👀";
    }
}

function nextQuestion() {
    locked = true;
    score++;
    feedback.textContent = "Dobrze! 💗";

    setTimeout(function() {
        currentQuestion++;
        showQuestion();
    }, 700);
}

function showResult() {
    feedback.textContent = "";
    quizContent.innerHTML = "";

    const heading = document.createElement("h2");
    heading.textContent = "Quiz ukończony! 💌";

    const result = document.createElement("p");
    result.className = "score";
    result.textContent = score + " / " + questions.length;

    const message = document.createElement("p");

    if (score === 4) {
        message.textContent = "OHOHO, poznałeś/aś mój sekret... 😭🖤";
    } else if (score >= 2) {
        message.textContent = "Całkiem nieźle! Ale jeszcze trochę tajemnic zostało...";
    } else {
        message.textContent = "Nooo, chyba trzeba jeszcze trochę się dowiedzieć 👀";
    }

    const restart = document.createElement("button");
    restart.type = "button";
    restart.textContent = "Spróbuj jeszcze raz 💕";
    restart.addEventListener("click", restartQuiz);

    quizContent.appendChild(heading);
    quizContent.appendChild(result);
    quizContent.appendChild(message);
    quizContent.appendChild(restart);
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    locked = false;
    showQuestion();
}

showQuestion();
</script>

</body>
</html>
