<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XO Crush</title>
<link rel="icon" type="image/png" href="images/calus.png">
<meta name="description" content="XO Crush 💌 Pamiętaj! Twoje uczucia należą do CIEBIE. Nie pozwól nikomu manipulować ani nimi, ani Tobą 🖤">

<style>
@font-face {
    font-family: "Margarine";
    src: url("images/Margarine-Regular.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: #171017 url("images/poprostu.png") center center / cover fixed no-repeat;
}

/* LOGO W LEWYM GÓRNYM ROGU */

.logo {
    position: absolute;
    top: 18px;
    left: 22px;
    width: 135px;
    height: auto;
    z-index: 10;
}

/* GÓRA STRONY */

.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    padding: 70px 20px 30px;
}

.hero-logo {
    width: 480px;
    max-width: 90%;
    height: auto;
    display: block;
    margin: 0 auto 20px;
}

.subtitle {
    font-family: "Margarine", cursive;
    font-size: 46px;
    font-weight: normal;
    color: white;
    text-shadow: 0 3px 12px #000, 0 0 20px #000;
    margin: 0;
    line-height: 1.4;
    max-width: 950px;

}

@keyframes subtitleAppear {
    from {
        opacity: 0;
        transform: translateY(22px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes subtitleFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}

/* DWA PANELE OBOK SIEBIE */

.panels {
    width: min(1250px, 94%);
    margin: -100px auto 70px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    align-items: stretch;
}

/* WSPÓLNY WYGLĄD OBU PANELI */

.panel {
    padding: 35px;
    background: rgba(25, 25, 25, 0.55);
    border: 1px solid rgba(180, 180, 180, 0.25);
    border-radius: 25px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.panel-title {
    font-family: "Margarine", cursive;
    font-weight: normal;
    font-size: 34px;
    text-align: center;
    margin: 0 0 12px;
    text-shadow: 0 2px 10px #000;
}

.panel-description {
    text-align: center;
    color: #dddddd;
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 28px;
}

/* LEWY PANEL: QUIZ */

.quiz-progress {
    display: flex;
    justify-content: center;
    gap: 9px;
    flex-wrap: wrap;
    margin: 25px 0;
}

.progress-number {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid #777777;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cccccc;
    font-size: 13px;
}

.progress-number.active {
    background: #111111;
    border-color: #aaaaaa;
    color: white;
}

.progress-number.done {
    background: #444444;
    color: white;
}

.quiz-question {
    font-family: "Margarine", cursive;
    font-size: 24px;
    font-weight: normal;
    text-align: center;
    line-height: 1.5;
    margin: 25px 0;
}

.quiz-answers {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.quiz-answer {
    width: 100%;
    padding: 14px 18px;
    text-align: left;
    color: white;
    background: #292929;
    border: 1px solid #555555;
    border-radius: 15px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
}

.quiz-answer:hover {
    background: #3b3b3b;
    border-color: #888888;
}

.quiz-answer.selected {
    background: #111111;
    border-color: #aaaaaa;
}

.quiz-controls {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 25px;
}

.main-button {
    padding: 12px 22px;
    color: white;
    background: #222222;
    border: 1px solid #666666;
    border-radius: 30px;
    cursor: pointer;
    font-size: 15px;
    transition: 0.2s;
}

.main-button:hover {
    background: #444444;
    border-color: #aaaaaa;
}

.main-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.quiz-message {
    min-height: 24px;
    text-align: center;
    color: #cccccc;
    font-size: 14px;
    margin-top: 15px;
    line-height: 1.5;
}

/* PRAWY PANEL: PYTANIA */

.crush-questions {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.crush-question {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 78px;
    width: 100%;
    padding: 18px;
    text-align: left;
    color: white;
    background: #292929;
    border: 1px solid #555555;
    border-radius: 16px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    transition: background 0.25s, transform 0.25s;
}

.crush-question:hover {
    background: #3b3b3b;
    border-color: #888888;
    transform: translateY(-3px);
}

.question-number {
    color: #cccccc;
    font-size: 13px;
}

.crush-question strong {
    font-size: 15px;
    font-weight: normal;
    flex: 1;
    line-height: 1.5;
}

.question-arrow {
    color: #cccccc;
    font-size: 22px;
}

/* OKIENKO Z ODPOWIEDZIĄ */

.crush-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(8, 4, 9, 0.78);
}

.crush-modal.open {
    display: flex;
}

.crush-modal-content {
    position: relative;
    width: 100%;
    max-width: 500px;
    padding: 40px 35px 35px;
    text-align: center;
    color: white;
    background: #222222;
    border: 1px solid #666666;
    border-radius: 25px;
    box-shadow: 0 15px 60px #0008;
    animation: modalAppear 0.25s ease-out;
}

@keyframes modalAppear {
    from {
        opacity: 0;
        transform: translateY(15px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-heart {
    display: block;
    font-size: 42px;
    color: #cccccc;
}

.crush-modal-content h2 {
    font-family: "Margarine", cursive;
    font-weight: normal;
    font-size: 28px;
    margin: 15px 0;
}

.crush-modal-content p {
    font-size: 16px;
    line-height: 1.8;
    color: #dddddd;
}

.modal-close {
    position: absolute;
    top: 10px;
    right: 16px;
    font-size: 32px;
    color: white;
    background: transparent;
    border: none;
    cursor: pointer;
}

/* TELEFONY I MNIEJSZE EKRANY */

@media (max-width: 900px) {
    .panels {
        grid-template-columns: 1fr;
        width: min(650px, 94%);
        margin: 20px auto 50px;
    }

    .hero {
        min-height: auto;
        padding-bottom: 35px;
    }

    .panel {
        padding: 30px 22px;
    }
}

@media (max-width: 700px) {
    .logo {
        width: 105px;
        top: 12px;
        left: 12px;
    }

    .hero {
        padding-top: 100px;
    }

    .hero-logo {
        width: 340px;
        max-width: 95%;
    }

    .subtitle {
        font-size: 32px;
    }

    body {
        background-attachment: scroll;
    }

    .panel-title {
        font-size: 29px;
    }

    .quiz-question {
        font-size: 21px;
    }

    .crush-question {
        min-height: 75px;
        padding: 15px;
    }

    .crush-modal-content {
        padding: 40px 22px 25px;
    }
}

/* OGRANICZENIE ANIMACJI */

@media (prefers-reduced-motion: reduce) {
    .subtitle {
        opacity: 1;
        transform: none;
        animation: none;
    }

    .crush-modal-content,
    .crush-question {
        animation: none;
        transition: none;
    }
}

/* MENU PODSTRON */
.site-nav {
    position: absolute;
    top: 22px;
    right: 22px;
    z-index: 20;
    display: flex;
    gap: 12px;
    align-items: center;
}

.site-nav a {
    display: inline-block;
    padding: 10px 17px;
    color: white;
    text-decoration: none;
    background: transparent;
    border: 1px solid rgba(180, 180, 180, 0.35);
    border-radius: 24px;
    font-size: 14px;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
}

.site-nav a:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.6);
    transform: translateY(-2px);
}


@media (max-width: 700px) {
    .site-nav {
        top: 16px;
        right: 12px;
        gap: 6px;
    }

    .site-nav a {
        padding: 8px 11px;
        font-size: 12px;
    }
}


</style>
</head>

<body>

<!-- MAŁE LOGO W ROGU -->

<img src="images/logoo.png" alt="XO CRUSH.pl" class="logo">

<nav class="site-nav" aria-label="Nawigacja strony">
    <a href="aboutweb.html">O stronie</a>
    <a href="aboutme.html">O mnie</a>
    <a href="quiz.html">Quiz 💌</a>
</nav>

<!-- GŁÓWNA CZĘŚĆ STRONY -->

<main>

    <section class="hero">

        <!-- DUŻE LOGO NA ŚRODKU -->

        <img src="images/logoo.png"
             alt="XO CRUSH.pl"
             class="hero-logo">

        <p class="subtitle">
            Czasem jedna osoba potrafi sprawić, że zwykły dzień staje się wyjątkowy. 💗
        </p>

    </section>

    <!-- DWA PANELE -->

    <section class="panels">

        <!-- LEWY PANEL: QUIZ -->

        <section class="panel quiz-panel">

            <h2 class="panel-title">Twój Crush Quiz 💌</h2>

            <p class="panel-description">
                Odpowiedz na pytania i odkryj coś o swoich uczuciach.
            </p>

            <div class="quiz-progress" id="quizProgress"></div>

            <h3 class="quiz-question" id="quizQuestion"></h3>

            <div class="quiz-answers" id="quizAnswers"></div>

            <div class="quiz-controls">
                <button class="main-button" id="previousQuestion">
                    ← Wstecz
                </button>

                <button class="main-button" id="nextQuestion">
                    Dalej →
                </button>
            </div>

            <div class="quiz-message" id="quizMessage"></div>

        </section>

        <!-- PRAWY PANEL: PYTANIA I ODPOWIEDZI -->

        <section class="panel crush-panel">

            <h2 class="panel-title">O czym myślisz? 🖤</h2>

            <p class="panel-description">
                Czasami serce zadaje pytania, na które trudno znaleźć odpowiedź...
            </p>

            <div class="crush-questions">

                <button class="crush-question"
                    data-title="Czemu o nim/niej tyle myślę?"
                    data-answer="Kiedy ktoś wzbudza w nas emocje, mózg potrafi często wracać do wspomnień i wyobrażeń związanych z tą osobą. Możesz myśleć o jej uśmiechu, rozmowach albo o tym, co wydarzy się następnym razem. To całkiem naturalne, gdy ktoś Ci się podoba. 🖤">

                    <span class="question-number">01</span>
                    <strong>Czemu o nim/niej tyle myślę?</strong>
                    <span class="question-arrow">↗</span>
                </button>

                <button class="crush-question"
                    data-title="Czy to już zakochanie?"
                    data-answer="Zauroczenie może być początkiem czegoś większego, ale nie ma jednego testu, który od razu da odpowiedź. Z czasem możesz lepiej poznać tę osobę i swoje uczucia. Nie musisz się spieszyć z nazywaniem tego, co czujesz.">

                    <span class="question-number">02</span>
                    <strong>Czy to już zakochanie?</strong>
                    <span class="question-arrow">↗</span>
                </button>

                <button class="crush-question"
                    data-title="Dlaczego się przy nim/niej stresuję?"
                    data-answer="Gdy zależy nam na czyjejś opinii, możemy zacząć bardziej zwracać uwagę na to, co mówimy i jak wypadamy. Dlatego zwykłe cześć może nagle wydawać się wielkim wydarzeniem. Twój mózg próbuje przewidzieć, jak potoczy się sytuacja.">

                    <span class="question-number">03</span>
                    <strong>Dlaczego się przy nim/niej stresuję?</strong>
                    <span class="question-arrow">↗</span>
                </button>

                <button class="crush-question"
                    data-title="Czy on/ona też może coś czuć?"
                    data-answer="To możliwe, ale pojedyncze spojrzenie, uśmiech czy wiadomość nie dają pewności. Najwięcej można dowiedzieć się z tego, jak ktoś rozmawia z Tobą, czy sam szuka kontaktu i czy traktuje Cię z szacunkiem.">

                    <span class="question-number">04</span>
                    <strong>Czy on/ona też może coś czuć?</strong>
                    <span class="question-arrow">↗</span>
                </button>

            </div>

        </section>

    </section>


        

</main>

<!-- OKIENKO Z ODPOWIEDZIĄ -->

<div class="crush-modal" id="crushModal" aria-hidden="true">

    <div class="crush-modal-content"
         role="dialog"
         aria-modal="true"
         aria-labelledby="modalTitle">

        <button class="modal-close"
                id="modalClose"
                aria-label="Zamknij okienko">×</button>

        <span class="modal-heart">♡</span>

        <h2 id="modalTitle"></h2>

        <p id="modalAnswer"></p>

        <button class="main-button" id="modalOkay">
            Rozumiem 🖤
        </button>

    </div>

</div>

<script>

/* QUIZ */

const questions = [
    {
        question: "Czy warto zrobić pierwszy krok?",
        answers: ["Tak, odważnie!", "Może kiedyś...", "Wolę poczekać"]
    },
    {
        question: "Czy wierzysz w miłość od pierwszego wejrzenia?",
        answers: ["Tak!", "Nie wiem", "Raczej nie"]
    },
    {
        question: "Co najbardziej cenisz w drugiej osobie?",
        answers: ["Poczucie humoru", "Szczerość", "Czułość"]
    },
    {
        question: "Jak reagujesz na komplement?",
        answers: ["Uśmiecham się", "Rumienię się", "Nie wiem, co powiedzieć"]
    },
    {
        question: "Czy zdarza Ci się myśleć o kimś przed snem?",
        answers: ["Często!", "Czasami", "Rzadko"]
    },
    {
        question: "Co jest ważniejsze?",
        answers: ["Zaufanie", "Wspólne zainteresowania", "Dobra komunikacja"]
    },
    {
        question: "Czy lubisz romantyczne niespodzianki?",
        answers: ["Uwielbiam!", "Zależy jakie", "Wolę spokój"]
    },
    {
        question: "Gotowy na odkrycie swojego wyniku?",
        answers: ["Tak!", "Jeszcze chwilę", "Dawaj wynik!"]
    }
];

let currentQuestion = 0;
let chosenAnswers = [];
let quizFinished = false;

const quizProgress = document.getElementById("quizProgress");
const quizQuestion = document.getElementById("quizQuestion");
const quizAnswers = document.getElementById("quizAnswers");
const quizMessage = document.getElementById("quizMessage");
const previousQuestion = document.getElementById("previousQuestion");
const nextQuestion = document.getElementById("nextQuestion");

function renderProgress() {
    quizProgress.innerHTML = "";

    questions.forEach((question, index) => {
        const number = document.createElement("div");

        number.className = "progress-number";
        number.textContent = index + 1;

        if (index === currentQuestion) {
            number.classList.add("active");
        }

        if (chosenAnswers[index] !== undefined) {
            number.classList.add("done");
        }

        quizProgress.appendChild(number);
    });
}

function renderQuiz() {
    const q = questions[currentQuestion];

    quizFinished = false;
    quizQuestion.textContent = q.question;
    quizAnswers.innerHTML = "";
    quizMessage.textContent = "";

    q.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.className = "quiz-answer";
        button.textContent = answer;

        if (chosenAnswers[currentQuestion] === index) {
            button.classList.add("selected");
        }

        button.addEventListener("click", () => {
            chosenAnswers[currentQuestion] = index;
            renderQuiz();
        });

        quizAnswers.appendChild(button);
    });

    previousQuestion.disabled = currentQuestion === 0;

    nextQuestion.textContent =
        currentQuestion === questions.length - 1
        ? "Zobacz wynik ♥"
        : "Dalej →";

    renderProgress();
}

previousQuestion.addEventListener("click", () => {
    if (!quizFinished && currentQuestion > 0) {
        currentQuestion--;
        renderQuiz();
    }
});

nextQuestion.addEventListener("click", () => {

    if (quizFinished) {
        currentQuestion = 0;
        chosenAnswers = [];
        renderQuiz();
        return;
    }

    if (chosenAnswers[currentQuestion] === undefined) {
        quizMessage.textContent = "Najpierw wybierz odpowiedź 🖤";
        return;
    }

    if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuiz();
        return;
    }

    showQuizResult();
});

function showQuizResult() {

    quizFinished = true;

    quizQuestion.textContent = "Twój wynik 🖤";
    quizAnswers.innerHTML = "";
    quizProgress.innerHTML = "";

    const result = document.createElement("p");

    result.style.textAlign = "center";
    result.style.lineHeight = "1.8";
    result.textContent =
        "Jesteś osobą, która ma przed sobą wiele pięknych możliwości. " +
        "Daj sobie czas i odkrywaj świat po swojemu.";

    quizAnswers.appendChild(result);

    previousQuestion.disabled = true;
    nextQuestion.textContent = "Spróbuj ponownie ↻";
    quizMessage.textContent = "";
}

/* OKIENKA PYTAŃ */

const crushModal = document.getElementById("crushModal");
const modalTitle = document.getElementById("modalTitle");
const modalAnswer = document.getElementById("modalAnswer");
const modalClose = document.getElementById("modalClose");
const modalOkay = document.getElementById("modalOkay");

let previousFocus = null;

document.querySelectorAll(".crush-question").forEach(button => {

    button.addEventListener("click", () => {

        previousFocus = button;

        modalTitle.textContent = button.dataset.title;
        modalAnswer.textContent = button.dataset.answer;

        crushModal.classList.add("open");
        crushModal.setAttribute("aria-hidden", "false");

        modalClose.focus();

    });

});

function closeCrushModal() {

    crushModal.classList.remove("open");
    crushModal.setAttribute("aria-hidden", "true");

    if (previousFocus) {
        previousFocus.focus();
    }

}

modalClose.addEventListener("click", closeCrushModal);
modalOkay.addEventListener("click", closeCrushModal);

crushModal.addEventListener("click", event => {

    if (event.target === crushModal) {
        closeCrushModal();
    }

});

document.addEventListener("keydown", event => {

    if (event.key === "Escape" && crushModal.classList.contains("open")) {
        closeCrushModal();
    }

});

renderQuiz();

/* ANIMACJA PISANIA NAPISU */

const subtitle = document.querySelector(".subtitle");

if (subtitle) {
    const text = subtitle.textContent.trim();
    subtitle.textContent = "";

    let index = 0;

    const cursor = document.createElement("span");
    cursor.style.borderRight = "3px solid white";
    cursor.style.paddingRight = "3px";

    subtitle.appendChild(cursor);

    const typing = setInterval(() => {
        cursor.textContent += text.charAt(index);
        index++;

        if (index >= text.length) {
            clearInterval(typing);
            cursor.style.borderRight = "none";
        }
    }, 50);
}  

</script>

</body>
</html>
