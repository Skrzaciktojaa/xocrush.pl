<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XoCrush</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Margarine&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Georgia, serif;
      background: #111;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.3)
        ),
        url("images/gory.png") center / cover no-repeat;

      color: white;
    }

    .hero-title {
      text-align: center;
      padding: 20px;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.75);
    }

    .title {
      font-family: "Margarine", sans-serif;
      font-size: clamp(36px, 7vw, 60px);
      font-weight: normal;
      margin-bottom: 12px;
    }

    .subtitle {
      font-family: "Margarine", sans-serif;
      font-size: clamp(19px, 3vw, 28px);
      min-height: 1.5em;
    }

    .typing-cursor {
      display: inline-block;
      margin-left: 3px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 45% {
        opacity: 1;
      }

      46%, 100% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <main class="hero">
    <div class="hero-title">

      <div class="title">
        XoCrush
      </div>

      <div class="subtitle">
        <span id="typing-text"></span><span class="typing-cursor">|</span>
      </div>

    </div>
  </main>

  <script>
    const typingText = document.getElementById("typing-text");
    const textToType = "Jeszcze trochę...";
    let currentIndex = 0;

    function typeText() {
      if (currentIndex < textToType.length) {
        typingText.textContent += textToType[currentIndex];
        currentIndex++;

        setTimeout(typeText, 90);
      }
    }

    setTimeout(typeText, 500);
  </script>

</body>
</html>
