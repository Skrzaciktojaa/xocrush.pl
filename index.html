
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO Crush</title>
<link rel="icon" type="image/png" href="images/calus.png">
<meta name="description" content="XO Crush 💌 Nie wiemy, co autor miał na myśli 🖤">

<style>
@font-face {
    font-family: "Margarine";
    src: url("images/Margarine-Regular.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: #171017 url("images/tlo.png") center center / cover fixed no-repeat;
}

.logo {
    position: absolute;
    top: 18px;
    left: 22px;
    width: 135px;
    height: auto;
    z-index: 10;
}

.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    padding: 70px 20px 50px;
}

.hero-logo {
    width: 480px;
    max-width: 90%;
    height: auto;
    display: block;
    margin: 0 auto 20px;
}

/* Animowany napis pod logo */
.subtitle {
    font-family: "Margarine", cursive;
    font-size: 46px;
    font-weight: normal;
    color: white;
    text-shadow: 0 3px 12px #000, 0 0 20px #000;
    margin: 0;
    line-height: 1.4;
    max-width: 950px;

    opacity: 0;
    transform: translateY(22px);
    animation:
        subtitleAppear 1.4s ease-out 0.3s forwards,
        subtitleFloat 3.5s ease-in-out 1.8s infinite;
}

@keyframes subtitleAppear {
    from {
        opacity: 0;
        transform: translateY(22px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes subtitleFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}

/* Telefon */
@media (max-width: 700px) {
    .logo {
        width: 105px;
        top: 12px;
        left: 12px;
    }

    .hero {
        padding-top: 100px;
    }

    .hero-logo {
        width: 340px;
        max-width: 95%;
    }

    .subtitle {
        font-size: 32px;
    }

    body {
        background-attachment: scroll;
    }
}

/* Ograniczenie animacji */
@media (prefers-reduced-motion: reduce) {
    .subtitle {
        opacity: 1;
        transform: none;
        animation: none;
    }
}
</style>
</head>

<body>

<img src="images/logoo.png" alt="XO CRUSH.pl" class="logo">

<main class="hero">

    <img src="images/logoo.png" alt="XO CRUSH.pl" class="hero-logo">

    <p class="subtitle">
        Did you know? Having a crush can make your brain release dopamine, the chemical linked to pleasure and motivation 🖤
    </p>

</main>

</body>
</html>
