<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XO Crush ❤️</title>
<link rel="icon" type="image/png" href="images/calus.png">
<meta name="description" content="XO Crush ❤️ Poznaj nasze fanfiki i powieści!">

<style>
@font-face {
    font-family: "Nunito";
    src: url("fonts/Nunito-Variable.woff2") format("woff2");
    font-style: normal;
    font-weight: 200 1000;
    font-display: swap;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Nunito", Arial, sans-serif;
    color: #ffffff;
    background: #0d080e url("images/poprostu.png") center center / cover fixed no-repeat;
    position: relative;
    display: flex;
    flex-direction: column;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: rgba(8, 5, 10, 0.7);
}

/* CZYSTA NAWIGACJA BEZ TŁA Z SUBTELNĄ KRESKĄ */

.site-nav-container {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 20px 10px;
    background: transparent;
    z-index: 20;
}

.site-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    align-items: center;
}

/* Subtelna, krótka linia pod menu */
.site-nav-container::after {
    content: "";
    display: block;
    width: 180px;
    height: 1px;
    margin-top: 14px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
}

.site-nav a {
    display: inline-block;
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    background: transparent;
    border: none;
    padding: 4px 6px;
    font-size: 13px;
    font-weight: 700;
    font-family: "Nunito", Arial, sans-serif;
    font-variant: small-caps;
    letter-spacing: 0.08em;
    transition: color 0.2s ease, transform 0.2s ease;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
}

.site-nav a:hover {
    color: #ffffff;
    transform: translateY(-1px);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

/* STRONA GŁÓWNA */

main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 50px;
    width: 100%;
}

.hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 650px;
    width: 100%;
}

.hero-logo {
    width: 420px;
    max-width: 85%;
    height: auto;
    display: block;
    margin: 0 auto 25px;
    filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
    animation: logoGlow 4s ease-in-out infinite alternate;
}

@keyframes logoGlow {
    from {
        filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
    }
    to {
        filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.6));
    }
}

/* TREŚCI GŁÓWNE */

.welcome-section {
    padding: 10px 15px;
}

.welcome-title {
    font-family: "Nunito", Arial, sans-serif;
    font-size: clamp(20px, 2.3vw, 28px);
    font-weight: 700;
    margin: 0 0 12px;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
}

.welcome-text {
    font-family: "Nunito", Arial, sans-serif;
    font-size: clamp(14px, 1.4vw, 16px);
    line-height: 1.6;
    color: #ded9e2;
    margin: 0 0 24px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
}

/* CZYSTY TEKSTOWY PRZYCISK BEZ RAMKI I BLURA */

.cta-button {
    display: inline-block;
    padding: 6px 12px;
    color: rgba(255, 255, 255, 0.9);
    text-decoration: none;
    background: transparent;
    border: none;
    font-family: "Nunito", Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    transition: color 0.2s ease, transform 0.2s ease;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
}

.cta-button:hover {
    color: #ffffff;
    transform: translateY(-1px);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

/* STOPKA */

.site-footer {
    text-align: center;
    padding: 18px 16px 22px;
    color: #e5dfa0;
    font-size: 12px;
    font-family: "Nunito", Arial, sans-serif;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(15, 10, 17, 0.5);
}

.site-footer span {
    display: block;
    margin-top: 4px;
    color: #bfaec4;
    font-size: 11px;
}

/* RESPONSYWNOŚĆ */

@media (max-width: 700px) {
    body {
        background-attachment: scroll;
    }

    .site-nav-container {
        padding: 18px 10px 10px;
    }

    .site-nav {
        gap: 16px;
    }

    .site-nav a {
        font-size: 12px;
    }

    main {
        padding: 30px 15px 35px;
    }

    .hero-logo {
        width: 290px;
        margin-bottom: 20px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="site-nav-container">
    <nav class="site-nav" aria-label="Nawigacja strony">
        <a href="aboutweb.html">O stronie</a>
        <a href="qa.html">Q&A</a>
    </nav>
</div>

<main>

    <section class="hero">

        <img src="images/logoo.png" alt="XO CRUSH.pl" class="hero-logo">

        <div class="welcome-section">
            <h1 class="welcome-title">Witaj w XO Crush 📜</h1>
            <p class="welcome-text">
                To przestrzeń stworzona dla opowiadań, historii i wolnych myśli. Rozgość się i zanurz w świecie zapisanych słów.
            </p>
            <a href="stories.html" class="cta-button">Czytaj historyjki ✨</a>
        </div>

    </section>

</main>

<footer class="site-footer">
    XOcrush.pl
    <span>© 2026 XOcrush.pl. Wszelkie prawa zastrzeżone.</span>
</footer>

</body>
</html>
