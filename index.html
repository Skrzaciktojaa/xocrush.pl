<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XoCrush</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Margarine&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Georgia, serif;
      background: #111;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.3)
        ),
        url("images/tlo.png") center / cover no-repeat;

      color: white;
    }

    /* LOGO */
    .site-logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 180px;
      height: auto;
      z-index: 10;
    }

    /* TYTUŁ PRZESUNIĘTY WYŻEJ */
    .hero-title {
      position: absolute;
      top: 23%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      padding: 20px;
      width: 100%;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.75);
    }

    .title {
      font-family: "Margarine", sans-serif;
      font-size: clamp(36px, 7vw, 60px);
      font-weight: normal;
      margin-bottom: 12px;
    }

    .subtitle {
      font-family: "Margarine", sans-serif;
      font-size: clamp(19px, 3vw, 28px);
      min-height: 1.5em;
    }

    .typing-cursor {
      display: inline-block;
      margin-left: 3px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    /* QUIZ */
    .quiz {
      position: absolute;
      top: 50%;
      right: 6%;
      transform: translateY(-50%);
      width: min(300px, 90%);
      padding: 24px;
      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 18px;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(5px);
      text-align: center;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
    }

    .quiz h2 {
      font-family: "Margarine", sans-serif;
      font-size: 25px;
      margin: 0 0 20px;
    }

    .question {
      font-family: "Margarine", sans-serif;
      font-size: 21px;
      min-height: 65px;
      margin-bottom: 18px;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .answers button,
    .restart {
      font-family: "Margarine", sans-serif;
      font-size: 18px;
      color: white;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid white;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .answers button:hover,
    .restart:hover {
      background: white;
      color: #111;
      transform: scale(1.03);
    }

    .progress {
      margin-top: 18px;
      font-size: 14px;
      opacity: 0.8;
    }

    .result {
      font-family: "Margarine", sans-serif;
      font-size: 22px;
      line-height: 1.5;
    }

    .restart {
      margin-top: 15px;
    }

    @media (max-width: 700px) {
      .site-logo {
        width: 130px;
        top: 16px;
        left: 16px;
      }

      .hero {
        min-height: 100svh;
        padding: 150px 16px 30px;
        flex-direction: column;
        justify-content: flex-start;
        gap: 25px;
        overflow: auto;
      }

      .hero-title {
        position: static;
        transform: none;
        padding: 0;
      }

      .quiz {
        position: static;
        transform: none;
        width: min(100%, 350px);
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <img
      src="images/logoo.png"
      class="site-logo"
      alt="XO Crush"
    >

    <div class="hero-title">
      <div class="title">XoCrush</div>

      <div class="subtitle">
        <span id="typing-text"></span>
        <span class="typing-cursor">|</span>
      </div>
    </div>

    <section class="quiz">
      <h2>GUESS MY CRUSH</h2>

      <div id="quiz-content">
        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <div class="progress" id="progress"></div>
      </div>
    </section>

  </main>

  <script>
    // ANIMOWANY NAPIS
    const typingText = document.getElementById("typing-text");
    const textToType = "Jeszcze trochę...";
    let currentIndex = 0;

    function typeText() {
      if (currentIndex < textToType.length) {
        typingText.textContent += textToType[currentIndex];
        currentIndex++;
        setTimeout(typeText, 90);
      }
    }

    setTimeout(typeText, 500);


    // PYTANIA QUIZU
    const questions = [
      {
        question: "Z której jest klasy?",
        answers: ["7A", "7B", "8A"],
        correct: 0
      },
      {
        question: "Jaki ma kolor włosów?",
        answers: ["Blond", "Brązowe", "Czarne"],
        correct: 1
      },
      {
        question: "Jak ma na imię?",
        answers: ["Kuba", "Heniek / Henryk", "Michał"],
        correct: 1
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionElement = document.getElementById("question");
    const answersElement = document.getElementById("answers");
    const progressElement = document.getElementById("progress");
    const quizContent = document.getElementById("quiz-content");

    function showQuestion() {
      const q = questions[currentQuestion];

      questionElement.textContent = q.question;
      answersElement.innerHTML = "";

      q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.textContent = answer;

        button.addEventListener("click", () => {
          checkAnswer(index);
        });

        answersElement.appendChild(button);
      });

      progressElement.textContent =
        `Pytanie ${currentQuestion + 1} z ${questions.length}`;
    }

    function checkAnswer(selectedIndex) {
      if (selectedIndex === questions[currentQuestion].correct) {
        score++;
      }

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      quizContent.innerHTML = `
        <div class="result">
          Twój wynik:<br>
          ${score} / ${questions.length}<br><br>
          ${
            score === 3
              ? "OMG, znasz go na wylot! 👀"
              : score === 2
              ? "Prawie idealnie! 🖤"
              : score === 1
              ? "Coś tam wiesz... 😭"
              : "Musisz jeszcze zgadywać!"
          }
        </div>

        <button class="restart" onclick="restartQuiz()">
          Zagraj ponownie
        </button>
      `;
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      showQuestion();
    }

    showQuestion();
  </script>

</body>
</html>
