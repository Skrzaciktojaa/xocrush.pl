```html
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XoCrush</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Margarine&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Georgia, serif;
      background: #111;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.3)
        ),
        url("images/tlo.png") center / cover no-repeat;

      color: white;
    }

    /* LOGO */
    .site-logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 180px;
      height: auto;
      z-index: 10;
    }

    /* TYTUŁ */
    .hero-title {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      padding: 20px;
      width: 100%;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.75);
    }

    .title {
      font-family: "Margarine", sans-serif;
      font-size: clamp(36px, 7vw, 60px);
      font-weight: normal;
      margin-bottom: 12px;
    }

    .subtitle {
      font-family: "Margarine", sans-serif;
      font-size: clamp(19px, 3vw, 28px);
      min-height: 1.5em;
    }

    .typing-cursor {
      display: inline-block;
      margin-left: 3px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    /* QUIZ */
    .quiz {
      position: absolute;
      top: 53%;
      right: 6%;
      transform: translateY(-50%);
      width: min(340px, 90%);
      padding: 24px;

      border: 2px solid rgba(255, 255, 255, 0.65);
      border-radius: 18px;

      background: rgba(20, 20, 20, 0.78);
      backdrop-filter: blur(5px);

      text-align: center;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
    }

    .quiz h2 {
      font-family: "Margarine", sans-serif;
      font-size: 25px;
      margin: 0 0 10px;
    }

    .hint {
      font-family: "Margarine", sans-serif;
      font-size: 13px;
      color: #ffd6e4;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .question {
      font-family: "Margarine", sans-serif;
      font-size: 21px;
      min-height: 55px;
      margin-bottom: 18px;
    }

    /* WPISYWANIE ODPOWIEDZI */
    #answer-input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;

      border-radius: 12px;
      border: 1px solid white;

      background: rgba(255, 255, 255, 0.12);
      color: white;

      font-family: "Margarine", sans-serif;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    #answer-input::placeholder {
      color: #bbb;
    }

    #answer-input:focus {
      border-color: #ffb7d0;
      box-shadow: 0 0 10px rgba(255, 183, 208, 0.3);
    }

    /* PRZYCISKI */
    .check-button,
    .restart {
      width: 100%;
      padding: 12px;

      border-radius: 12px;
      border: 1px solid white;

      background: white;
      color: #222;

      font-family: "Margarine", sans-serif;
      font-size: 18px;
      cursor: pointer;

      transition: 0.2s;
    }

    .check-button:hover,
    .restart:hover {
      background: #ffd6e4;
      transform: scale(1.03);
    }

    .progress {
      margin-top: 18px;
      font-size: 14px;
      opacity: 0.8;
    }

    /* WYNIK */
    .result {
      font-family: "Margarine", sans-serif;
      font-size: 22px;
      line-height: 1.5;
    }

    .restart {
      margin-top: 18px;
    }

    /* PYTANIE O PŁEĆ */
    .gender-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .gender-button {
      width: 50%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid white;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      font-size: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    .gender-button:hover {
      background: white;
      color: #222;
      transform: scale(1.05);
    }

    /* TELEFONY */
    @media (max-width: 700px) {
      .site-logo {
        width: 130px;
        top: 16px;
        left: 16px;
      }

      .hero {
        min-height: 100svh;
        padding: 150px 16px 30px;
        flex-direction: column;
        justify-content: flex-start;
        gap: 25px;
        overflow: auto;
      }

      .hero-title {
        position: static;
        transform: none;
        padding: 0;
      }

      .quiz {
        position: static;
        transform: none;
        width: min(100%, 350px);
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <main class="hero">

    <!-- LOGO -->
    <img
      src="images/logoo.png"
      class="site-logo"
      alt="XO Crush"
    >

    <!-- TYTUŁ -->
    <div class="hero-title">
      <div class="title">XoCrush</div>

      <div class="subtitle">
        <span id="typing-text"></span>
        <span class="typing-cursor">|</span>
      </div>
    </div>

    <!-- QUIZ -->
    <section class="quiz">
      <h2>GUESS MY CRUSH</h2>

      <div class="hint">
        JAK SIĘ DOWIESZ,<br>
        TO NIKOMU NIE MÓW 🤫
      </div>

      <div id="quiz-content"></div>
    </section>

  </main>

  <script>
    // ANIMOWANY NAPIS
    const typingText = document.getElementById("typing-text");
    const textToType = "Jeszcze trochę...";
    let currentIndex = 0;

    function typeText() {
      if (currentIndex < textToType.length) {
        typingText.textContent += textToType[currentIndex];
        currentIndex++;
        setTimeout(typeText, 90);
      }
    }

    setTimeout(typeText, 500);


    // PYTANIA QUIZU
    const questions = [
      {
        question: "Z której jest klasy?",
        accepted: ["7a", "8b"],
        type: "text"
      },
      {
        question: "Jaki ma kolor włosów?",
        accepted: ["brązowe"],
        type: "text"
      },
      {
        question: "Jak ma na imię?",
        accepted: ["heniek", "henryk"],
        type: "text"
      },
      {
        question: "Jakiej jest płci?",
        accepted: ["♂️"],
        type: "gender"
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const quizContent = document.getElementById("quiz-content");

    // NORMALIZOWANIE WPISYWANYCH ODPOWIEDZI
    function normalizeAnswer(answer) {
      return answer
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }

    // WYŚWIETLANIE PYTANIA
    function showQuestion() {
      const q = questions[currentQuestion];

      let answerHTML = "";

      if (q.type === "gender") {
        answerHTML = `
          <div class="gender-buttons">
            <button
              type="button"
              class="gender-button"
              onclick="checkGender('♂️')"
              aria-label="Mężczyzna"
            >
              ♂️
            </button>

            <button
              type="button"
              class="gender-button"
              onclick="checkGender('♀️')"
              aria-label="Kobieta"
            >
              ♀️
            </button>
          </div>
        `;
      } else {
        answerHTML = `
          <form id="answer-form">
            <input
              type="text"
              id="answer-input"
              placeholder="Wpisz odpowiedź..."
              autocomplete="off"
              required
            >

            <button type="submit" class="check-button">
              SPRAWDŹ
            </button>
          </form>
        `;
      }

      quizContent.innerHTML = `
        <div class="question">${q.question}</div>

        ${answerHTML}

        <div class="progress">
          Pytanie ${currentQuestion + 1} z ${questions.length}
        </div>
      `;

      if (q.type === "text") {
        const form = document.getElementById("answer-form");
        const input = document.getElementById("answer-input");

        form.addEventListener("submit", function(event) {
          event.preventDefault();

          const answer = normalizeAnswer(input.value);

          if (q.accepted.includes(answer)) {
            score++;
          }

          nextQuestion();
        });
      }
    }

    // SPRAWDZANIE PŁCI
    function checkGender(answer) {
      if (answer === "♂️") {
        score++;
      }

      nextQuestion();
    }

    // NASTĘPNE PYTANIE
    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    // WYNIK
    function showResult() {
      quizContent.innerHTML = `
        <div class="result">
          Twój wynik:<br>
          ${score} / ${questions.length}<br><br>

          ${
            score === 4
              ? "OMG, odkryłeś/aś mój sekret! 🖤"
              : score === 3
              ? "Prawie idealnie! 👀"
              : score === 2
              ? "Całkiem nieźle! 😭"
              : score === 1
              ? "Coś tam wiesz..."
              : "Musisz jeszcze zgadywać!"
          }
        </div>

        <button
          type="button"
          class="restart"
          onclick="restartQuiz()"
        >
          Spróbuj jeszcze raz
        </button>
      `;
    }

    // RESET QUIZU
    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      showQuestion();
    }

    // START
    showQuestion();
  </script>

</body>
</html>
