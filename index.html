<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XO Crush</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background-image: url("images/tlo.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #170c13;
        }

        /* Logo w lewym górnym rogu */
        .logo {
            position: absolute;
            top: 25px;
            left: 30px;
            width: 180px;
            height: auto;
            z-index: 10;
        }

        /* Główna zawartość strony */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 150px 20px 50px;
        }

        /* Logo zamiast tytułu */
        .hero-logo {
            width: 300px;
            max-width: 85%;
            height: auto;
            display: block;
            margin: 0 auto 20px;
        }

        .subtitle {
            font-size: 22px;
            color: #ffffff;
            text-shadow: 0 2px 10px #000;
            margin: 0;
        }

        /* Panel quizu */
        .quiz {
            width: min(400px, 90%);
            margin-top: 45px;
            padding: 25px;
            background: rgba(20, 10, 20, 0.85);
            border: 1px solid rgba(255, 180, 210, 0.5);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 80, 150, 0.2);
            backdrop-filter: blur(8px);
        }

        .quiz h2 {
            margin-top: 0;
            color: #ffb5d2;
            font-size: 24px;
        }

        .question {
            font-size: 19px;
            margin: 20px 0;
        }

        .hint {
            font-size: 13px;
            color: #ffc2dc;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #ff9dc5;
            background: #fff;
            color: #222;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            background: #ff8fbd;
            color: #3b1025;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ffc1da;
            transform: scale(1.03);
        }

        .answer-button {
            display: block;
            width: 100%;
            margin: 10px 0;
        }

        .gender-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .gender-button {
            font-size: 35px;
            width: 100px;
            height: 75px;
        }

        #feedback {
            margin-top: 15px;
            font-size: 16px;
            line-height: 1.5;
        }

        .score {
            font-size: 30px;
            color: #ffb5d2;
            margin: 20px 0;
        }

        /* Telefon */
        @media (max-width: 700px) {
            .logo {
                width: 130px;
                top: 15px;
                left: 15px;
            }

            .hero {
                padding-top: 130px;
                justify-content: flex-start;
            }

            .hero-logo {
                width: 250px;
            }

            .subtitle {
                font-size: 18px;
            }

            .quiz {
                margin-top: 35px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Logo w rogu strony -->
    <img src="images/logoo.png" alt="XO CRUSH.pl" class="logo">

    <main class="hero">

        <!-- Logo zamiast napisu XoCrush -->
        <img src="images/logoo.png" alt="XO CRUSH.pl" class="hero-logo">

        <p class="subtitle">Jeszcze trochę...</p>

        <section class="quiz" id="quiz">

            <h2>💌 Mały quiz</h2>

            <p class="hint">
                JAK SIĘ DOWIESZ, TO NIKOMU NIE MÓW 🤫
            </p>

            <div id="quizContent"></div>

            <p id="feedback"></p>

        </section>

    </main>

    <script>
        const questions = [
            {
                question: "Z której jest klasy?",
                type: "text",
                answers: ["7a", "8b"]
            },
            {
                question: "Jaki ma kolor włosów?",
                type: "text",
                answers: ["brązowe"]
            },
            {
                question: "Jak ma na imię?",
                type: "text",
                answers: ["heniek", "henryk"]
            },
            {
                question: "Jakiej jest płci?",
                type: "gender",
                answer: "♂️"
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        const quizContent = document.getElementById("quizContent");
        const feedback = document.getElementById("feedback");

        function showQuestion() {
            feedback.textContent = "";

            if (currentQuestion >= questions.length) {
                showResult();
                return;
            }

            const q = questions[currentQuestion];

            let html = `
                <p class="question">${q.question}</p>
            `;

            if (q.type === "text") {
                html += `
                    <input
                        type="text"
                        id="answerInput"
                        placeholder="Wpisz odpowiedź..."
                        autocomplete="off"
                    >

                    <button type="button" onclick="checkAnswer()">
                        Sprawdź 💗
                    </button>
                `;
            }

            if (q.type === "gender") {
                html += `
                    <div class="gender-buttons">
                        <button
                            type="button"
                            class="gender-button"
                            onclick="checkGender('♂️')"
                        >♂️</button>

                        <button
                            type="button"
                            class="gender-button"
                            onclick="checkGender('♀️')"
                        >♀️</button>
                    </div>
                `;
            }

            quizContent.innerHTML = html;
        }

        function checkAnswer() {
            const input = document.getElementById("answerInput");

            if (!input) return;

            const answer = input.value
                .trim()
                .toLowerCase()
                .replace(/\s+/g, " ");

            if (answer === "") {
                feedback.textContent = "Wpisz odpowiedź najpierw 🥺";
                return;
            }

            const correctAnswers = questions[currentQuestion].answers;

            if (correctAnswers.includes(answer)) {
                score++;
                feedback.textContent = "Dobrze! 💗";
                currentQuestion++;

                setTimeout(showQuestion, 700);
            } else {
                feedback.textContent = "Hmm, spróbuj jeszcze raz 👀";
            }
        }

        function checkGender(answer) {
            if (answer === questions[currentQuestion].answer) {
                score++;
                feedback.textContent = "Dobrze! 💗";
                currentQuestion++;

                setTimeout(showQuestion, 700);
            }
