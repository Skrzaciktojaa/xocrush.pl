<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XO Crush | ❤️</title>
<link rel="icon" type="image/png" href="images/calus.png">
<meta name="description" content="XO Crush 💌 Twoje bezpieczne miejsce na opowiadania i historie.">

<style>
@font-face {
    font-family: "Nunito";
    src: url("fonts/Nunito-Variable.woff2") format("woff2");
    font-style: normal;
    font-weight: 200 1000;
    font-display: swap;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Nunito", Arial, sans-serif;
    color: #ffffff;
    background: #171017 url("images/poprostu.png") center center / cover fixed no-repeat;
    position: relative;
    display: flex;
    flex-direction: column;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: rgba(12, 8, 14, 0.55);
}

/* NAWIGACJA Z CZYSTYM TEKSTEM (BEZ RAMEK I TŁA) */

.site-nav {
    position: absolute;
    top: 22px;
    right: 22px;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 18px;
    align-items: center;
}

.site-nav a {
    display: inline-block;
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    background: transparent;
    border: none;
    padding: 4px 8px;
    font-size: 13px;
    font-weight: 600;
    font-family: "Nunito", Arial, sans-serif;
    transition: color 0.2s ease, transform 0.2s ease;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
}

.site-nav a:hover {
    color: #ffffff;
    transform: translateY(-1px);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

/* PRZYCISK HOMOFOBII Z LEKKIM PODŚWIETLENIEM TEKSTU */

.site-nav a[href="antyhomophobia.html"] {
    background: linear-gradient(110deg, #ff6b9d, #ffb86c, #8cffb0, #78d8ff, #c5a3ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
}

.site-nav a[href="antyhomophobia.html"]:hover {
    filter: brightness(1.2);
}

/* STRONA GŁÓWNA */

main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 50px;
    width: 100%;
}

.hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 650px;
    width: 100%;
}

.hero-logo {
    width: 420px;
    max-width: 85%;
    height: auto;
    display: block;
    margin: 0 auto 25px;
    filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
    animation: logoGlow 4s ease-in-out infinite alternate;
}

@keyframes logoGlow {
    from {
        filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
    }
    to {
        filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.6));
    }
}

/* LEKKIE I MINIMALISTYCZNE TREŚCI GŁÓWNE */

.welcome-section {
    padding: 10px 15px;
}

.welcome-title {
    font-family: "Nunito", Arial, sans-serif;
    font-size: clamp(20px, 2.3vw, 28px);
    font-weight: 700;
    margin: 0 0 12px;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
}

.welcome-text {
    font-family: "Nunito", Arial, sans-serif;
    font-size: clamp(14px, 1.4vw, 16px);
    line-height: 1.6;
    color: #ded9e2;
    margin: 0 0 24px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
}

/* PROSTY PRZYCISK BEZ MOCNEJ RAMKI */

.cta-button {
    display: inline-block;
    padding: 10px 24px;
    color: #ffffff;
    text-decoration: none;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    font-family: "Nunito", Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}

.cta-button:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.4);
    transform: translateY(-1px);
}

/* STOPKA */

.site-footer {
    text-align: center;
    padding: 18px 16px 22px;
    color: #e5dfa0;
    font-size: 12px;
    font-family: "Nunito", Arial, sans-serif;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(15, 10, 17, 0.25);
}

.site-footer span {
    display: block;
    margin-top: 4px;
    color: #bfaec4;
    font-size: 11px;
}

/* RESPONSYWNOŚĆ */

@media (max-width: 700px) {
    body {
        background-attachment: scroll;
    }

    .site-nav {
        position: relative;
        top: auto;
        right: auto;
        padding: 14px 10px 0;
        justify-content: center;
        gap: 12px;
    }

    .site-nav a {
        font-size: 12px;
        padding: 3px 5px;
    }

    main {
        padding: 25px 15px 35px;
    }

    .hero-logo {
        width: 290px;
        margin-bottom: 20px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<nav class="site-nav" aria-label="Nawigacja strony">
    <a href="aboutweb.html">O stronie 📃</a>
    <a href="qa.html">Q&A 💌</a>
    <a href="antyhomophobia.html">Homofobia i akceptacja 🤍</a>
</nav>

<main>

    <section class="hero">

        <img src="images/logoo.png" alt="XO CRUSH.pl" class="hero-logo">

        <div class="welcome-section">
            <h1 class="welcome-title">Witaj w XO Crush 📜</h1>
            <p class="welcome-text">
                To przestrzeń stworzona dla opowiadań, historii i wolnych myśli. Rozgość się i zanurz w świecie zapisanych słów.
            </p>
            <a href="stories.html" class="cta-button">Czytaj historyjki ✨</a>
        </div>

    </section>

</main>

<footer class="site-footer">
    XOcrush.pl
    <span>© 2026 XOcrush.pl. Wszelkie prawa zastrzeżone.</span>
</footer>

</body>
</html>
